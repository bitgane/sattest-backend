name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uses tsconfig.build.json (excludes tests + drops the jest types that a
      # devDep-stripped production build wouldn't have), matching `npm run build`.
      - name: Typecheck
        run: npx tsc -p tsconfig.build.json --noEmit

      # Tests are self-contained: db is mocked and jest.setup.js provides env
      # defaults, so no Postgres or .env is needed in CI.
      - name: Test
        run: npm test
