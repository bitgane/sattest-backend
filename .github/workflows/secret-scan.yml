name: Secret scan

on:
  push:
    branches: [master, main]
  pull_request:

# Scans the full git history of every push and pull request for committed
# secrets (API keys, private keys, connection strings), so credentials can't
# land in this public repo unnoticed.
#
# gitleaks-action is free for individual accounts and public repositories. Repos
# under a GitHub *Organization* need a free GITLEAKS_LICENSE (see the action's
# README); add it as a repository secret if this ever runs under an org.
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
